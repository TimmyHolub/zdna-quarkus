syntax = "proto3";

package zdnaanalysis;

import "google/protobuf/wrappers.proto";

option java_package = "cz.mendelu.dnaAnalyser.grpc.analysis";
option java_multiple_files = true;

message ZdnaAnalysisInput {
  string sequenceDataPlain = 1;
  int32 minSequenceSize = 2;
  float threshold = 3;
  float gc = 4;
  float gtac = 5;
  float at = 6;
}

message ZdnaAnalysisResult {
  google.protobuf.Int64Value id = 1;
  int32 position = 2;
  int32 length = 3;
  string sequence = 4;
  double zdnaGCRichness = 5;
  double zdnaGTRichness = 6;
  float score = 7;
  float scorePerc = 8;
}

message ZdnaAnalysisResponse {
  repeated ZdnaAnalysisResult results = 1;
}

service ZdnaAnalysisService {
  rpc analyzeZdna (ZdnaAnalysisInput) returns (ZdnaAnalysisResponse);
}
syntax = "proto3";

package zdnaanalysisStreaming;

import "google/protobuf/wrappers.proto";

option java_package = "cz.mendelu.dnaAnalyser.grpc.analysisStreaming";
option java_multiple_files = true;

message ZdnaAnalysisConfig {
  int32 minSequenceSize = 1;
  float threshold = 2;
  float gc = 3;
  float gtac = 4;
  float at = 5;
}

message SequenceChunk {
  string data = 1;
}

message ZdnaAnalysisRequest {
  oneof type {
    ZdnaAnalysisConfig config = 1;
    SequenceChunk chunk = 2;
  }
}

message ZdnaAnalysisResult {
  google.protobuf.Int64Value id = 1;
  int32 position = 2;
  int32 length = 3;
  string sequence = 4;
  double zdnaGCRichness = 5;
  double zdnaGTRichness = 6;
  float score = 7;
  float scorePerc = 8;
}

message ZdnaAnalysisResponse {
  repeated ZdnaAnalysisResult results = 1;
}

service ZdnaAnalysisService {
  rpc analyzeZdna (stream ZdnaAnalysisRequest) returns (ZdnaAnalysisResponse) {}
}

syntax = "proto3";

package hello;

option java_package = "cz.mendelu.dnaAnalyser.grpc.hello";
option java_multiple_files = true;

message HelloRequest {
  string message = 1;
}

message HelloReply {
  string message = 1;
}

service HelloService {
  rpc exchangeMessage(HelloRequest) returns (HelloReply);
}